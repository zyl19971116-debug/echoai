<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Human wallet silhouette">
  <defs>
    <linearGradient id="h-body" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#131B2E"/>
      <stop offset="55%" stop-color="#0A1020"/>
      <stop offset="100%" stop-color="#05080F"/>
    </linearGradient>
    <linearGradient id="h-rim" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0%" stop-color="#4C8DFF" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#5E8BFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9B6BFF" stop-opacity="0.28"/>
    </linearGradient>
    <radialGradient id="h-halo" cx="50%" cy="34%" r="52%">
      <stop offset="0%" stop-color="#2C4A8F" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#2C4A8F" stop-opacity="0"/>
    </radialGradient>
    <filter id="h-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="h-clip">
      <path d="M300 232c62 0 108 46 108 112 0 44-16 80-42 100l48 22c86 26 140 108 150 234H136c10-126 64-208 150-234l48-22c-26-20-42-56-42-100 0-66 46-112 108-112z"/>
    </clipPath>
  </defs>

  <rect width="600" height="800" fill="#04070E"/>
  <circle cx="300" cy="290" r="270" fill="url(#h-halo)"/>

  <!-- silhouette body -->
  <path d="M300 232c62 0 108 46 108 112 0 44-16 80-42 100l48 22c86 26 140 108 150 234H136c10-126 64-208 150-234l48-22c-26-20-42-56-42-100 0-66 46-112 108-112z" fill="url(#h-body)"/>

  <!-- rim light -->
  <g clip-path="url(#h-clip)">
    <path d="M108 232c62 0 108 46 108 112 0 44-16 80-42 100l48 22c86 26 140 108 150 234" fill="none" stroke="url(#h-rim)" stroke-width="2.2" filter="url(#h-soft)" opacity="0.85"/>
    <path d="M300 232c62 0 108 46 108 112 0 44-16 80-42 100l48 22c86 26 140 108 150 234H136c10-126 64-208 150-234l48-22c-26-20-42-56-42-100 0-66 46-112 108-112z" fill="none" stroke="url(#h-rim)" stroke-width="1.1" opacity="0.6"/>
  </g>

  <!-- shoulder line accents -->
  <path d="M172 520c26-30 74-52 128-52s102 22 128 52" fill="none" stroke="#4C8DFF" stroke-width="0.8" opacity="0.28"/>

  <!-- faint chest grid -->
  <g clip-path="url(#h-clip)" opacity="0.16">
    <path d="M120 600h360M120 648h360M120 696h360M180 560v200M240 546v214M300 540v220M360 546v214M420 560v200" stroke="#7FA6FF" stroke-width="0.6"/>
  </g>

  <!-- ground reflection -->
  <ellipse cx="300" cy="772" rx="210" ry="18" fill="#4C8DFF" opacity="0.12" filter="url(#h-soft)"/>
</svg>
